{{ define "main" }}
    <section class="taxonomy-header">
        <h2>{{ .Title }}</h2>
        <p>分类: {{ .Data.Term }}</p>
        <p>共 {{ len .Pages }} 篇文章</p>
    </section>
    
    <section class="posts">
        <ul class="post-list">
            {{ range .Pages }}    
            <li class="post-item">
                <h3 class="post-title"><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
                <div class="post-date">{{ .Date.Format "2006-01-02" }}</div>
                <div class="post-excerpt">{{ .Summary }}</div>
                <a href="{{ .Permalink }}" class="read-more">阅读更多 →</a>
            </li>
            {{ else }}
            <p>这个分类下还没有文章。</p>
            {{ end }}
        </ul>
    </section>
{{ end }}
