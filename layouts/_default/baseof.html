<!DOCTYPE html>
<html lang="{{ .Lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} - {{ .Site.Title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #eee;
        }
        h1 {
            color: #2c3e50;
        }
        .nav {
            margin: 20px 0;
        }
        .nav a {
            margin: 0 10px;
            color: #3498db;
            text-decoration: none;
        }
        .nav a:hover {
            text-decoration: underline;
        }
        main {
            padding: 40px 0;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #eee;
            font-size: 0.9em;
            color: #7f8c8d;
        }
        .post-list {
            list-style: none;
            padding: 0;
        }
        .post-item {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }
        .post-title {
            font-size: 1.5em;
            margin: 0 0 10px 0;
        }
        .post-date {
            color: #7f8c8d;
            font-size: 0.9em;
        }
        .read-more {
            display: inline-block;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
        }
        .read-more:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="{{ .Site.BaseURL }}" style="text-decoration: none; color: inherit;">{{ .Site.Title }}</a></h1>
        {{ if .IsHome }}
        <p>{{ .Site.Params.description }}</p>
        {{ end }}
        <div class="nav">
            <a href="{{ .Site.BaseURL }}">首页</a>
            <a href="{{ .Site.BaseURL }}posts/">文章</a>
        </div>
    </header>
    
    <main>
        {{ block "main" . }}
        {{ end }}
    </main>
    
    <footer>
        <p>© {{ now.Year }} {{ .Site.Author }} - 极简博客</p>
    </footer>
</body>
</html>
